name: CI

# Trigger the workflow on push or pull request
on:
  push:
    branches:
      - master
      - main
  pull_request:

# the `concurrency` settings ensure that not too many CI jobs run in parallel
concurrency:
  # group by workflow and ref; the last slightly strange component ensures that for pull
  # requests, we limit to 1 concurrent job, but for the default repository branch we don't
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  # Cancel intermediate builds, but only if it is a pull request build.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # The CI test job
  test:
    name: "${{ matrix.os }}: GAP ${{ matrix.gap-version }}"
    runs-on: ${{ matrix.os }}-latest
    env:
      # coverage tracking in the C binaries, on the jobs that report it
      EXTRA_CFLAGS: ${{ matrix.os == 'ubuntu' && '--coverage' || '' }}
    strategy:
      fail-fast: false
      matrix:
        gap-version:
          - 'devel'   # current GAP development version from git
          - 'latest'  # latest GAP release
          - 'minimal' # oldest GAP release supported by this package
        os:
          - ubuntu
        # The GAP code writes files for the external programs to read and
        # runs them as subprocesses, which is where the systems differ. One
        # job per system shows that up; crossing it with every GAP version
        # would not.
        include:
          - gap-version: 'devel'
            os: macos
          - gap-version: 'devel'
            os: windows

    steps:
      - uses: actions/checkout@v6
      - uses: gap-actions/setup-cygwin@v2
        if: ${{ runner.os == 'Windows' }}
      - uses: gap-actions/setup-gap@v3
        with:
          gap-version: ${{ matrix.gap-version }}
      - uses: gap-actions/build-pkg@v3
      - uses: gap-actions/run-pkg-tests@v4
      - uses: gap-actions/run-pkg-tests@v4
        if: ${{ runner.os != 'Windows' }}
        with:
          mode: onlyneeded
      - name: Exercise the standalone-only programs
        run: make check-standalone
      # gcov is only set up to work on the Linux jobs
      - uses: gap-actions/process-coverage@v3
        if: ${{ runner.os == 'Linux' }}
      - name: Process C coverage
        if: ${{ runner.os == 'Linux' }}
        run: gcov -pb obj/*/*.gcno
      - uses: codecov/codecov-action@v6
        if: ${{ runner.os == 'Linux' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The C code manipulates words in fixed-size buffers all over; run the same
  # tests once more with AddressSanitizer watching.
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    env:
      EXTRA_CFLAGS: "-fsanitize=address -g"
      ASAN_OPTIONS: "detect_leaks=0"  # the programs free nothing before exit
    steps:
      - uses: actions/checkout@v6
      - uses: gap-actions/setup-gap@v3
      - uses: gap-actions/build-pkg@v3
      - uses: gap-actions/run-pkg-tests@v4
      - name: Exercise the standalone-only programs
        run: make check-standalone
